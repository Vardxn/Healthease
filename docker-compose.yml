version: '3.8'
services:
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - healthease-network

  server:
    build: ./server
    ports:
      - "5001:5001"
    environment:
      - MONGO_URI=mongodb://mongo:27017/healthease
      - PORT=5001
      - CLIENT_URL=http://localhost:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME}
    depends_on:
      - mongo
    networks:
      - healthease-network

  client:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
    depends_on:
      - server
    networks:
      - healthease-network

networks:
  healthease-network:
    driver: bridge

volumes:
  mongo-data:
