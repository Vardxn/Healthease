version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: healthease-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - healthease_network
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: healthease-server
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/healthease
      - NODE_ENV=development
      # Note: For production, secret keys would be injected securely via CI/CD secrets
      - JWT_SECRET=development_secret_key_change_me_in_prod
    depends_on:
      - mongodb
    networks:
      - healthease_network
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: healthease-client
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
      - NODE_ENV=development
    depends_on:
      - server
    networks:
      - healthease_network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  healthease_network:
    driver: bridge
